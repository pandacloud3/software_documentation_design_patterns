<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{{ 'Редагувати' if dentist else 'Додати' }} Лікаря</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 card p-4 shadow">
            <h2 class="mb-4 text-center">{{ 'Редагувати дані лікаря' if dentist else 'Додати нового лікаря' }}</h2>
            
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">ПІБ Лікаря</label>
                    <input type="text" class="form-control" name="full_name" value="{{ dentist.full_name if dentist else '' }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Номер Ліцензії</label>
                    <input type="text" class="form-control" name="license_number" value="{{ dentist.license_number if dentist else '' }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Спеціалізація</label>
                    <input type="text" class="form-control" name="specialization" value="{{ dentist.specialization if dentist else '' }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Номер кабінету</label>
                    <input type="number" class="form-control" name="cabinet_number" value="{{ dentist.cabinet_number if dentist else '' }}" required>
                </div>
                
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-success">💾 Зберегти дані</button>
                    <a href="{{ url_for('api.index') }}" class="btn btn-secondary">🔙 Повернутися до списку</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
